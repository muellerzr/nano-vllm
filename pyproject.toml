[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "A fixed-target MiniMax M2 inference engine for four SM120 GPUs"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cuda-toolkit[cccl,nvcc]==13.0.3.0",
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flashinfer-python==0.6.15.post1",
    "cuda-python>=13.0",
    "ninja",
]

[project.urls]
Homepage = "https://github.com/muellerzr/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
